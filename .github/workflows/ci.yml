name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      webui: ${{ steps.filter.outputs.webui }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/deploy-backend.yml'
            webui:
              - 'webUI/**'
              - '.github/workflows/deploy-frontend.yml'
            mobile:
              - 'mobile/**'

  backend-tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: priddyspaces
          POSTGRES_PASSWORD: priddyspaces
          POSTGRES_DB: priddyspaces_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U priddyspaces -d priddyspaces_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg2://priddyspaces:priddyspaces@localhost:5432/priddyspaces_test
      TEST_DATABASE_URL: postgresql+psycopg2://priddyspaces:priddyspaces@localhost:5432/priddyspaces_test
      SECRET_KEY: ci-test-secret
      CORS_ALLOW_ORIGINS: http://localhost:3000
      REDIS_URL: redis://localhost:6379/0
      FRONTEND_URL: http://localhost:3000
      PAYMENT_CREDENTIAL_ENCRYPTION_KEY: ci-encryption-key-32-bytes-long
      SENDGRID_API_KEY: ""
      OPENAI_API_KEY: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Run database migrations
        run: python -m alembic upgrade head

      - name: Run backend tests
        run: pytest -q

  webui-tests:
    needs: changes
    if: needs.changes.outputs.webui == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webUI
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: webUI/package-lock.json

      - name: Install webUI dependencies
        run: npm ci

      - name: Run webUI tests
        env:
          CI: true
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chrome

      - name: Run webUI e2e
        # Real Clerk keys live in environment-scoped secrets (used by
        # deploy-frontend.yml). For e2e we use the build-time bypass flag
        # instead — middleware no-ops, ClerkProvider is unmounted, and
        # layouts use the localStorage-backed useMe variant that
        # mockSession() already populates.
        env:
          CI: true
          E2E_BYPASS_CLERK: "1"
          NEXT_PUBLIC_E2E_BYPASS_CLERK: "1"
        run: npm run test:e2e

  mobile-tests:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Run mobile tests
        run: npm test -- --runInBand

  deploy-backend-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.backend == 'true'
    needs:
      - changes
      - backend-tests
    uses: ./.github/workflows/deploy-backend.yml
    with:
      environment: dev
    secrets: inherit

  deploy-frontend-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.webui == 'true'
    needs:
      - changes
      - webui-tests
    uses: ./.github/workflows/deploy-frontend.yml
    with:
      environment: dev
    secrets: inherit
