name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      webui: ${{ steps.filter.outputs.webui }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            webui:
              - 'webUI/**'

  backend-tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite://
      SECRET_KEY: ci-test-secret
      CORS_ALLOW_ORIGINS: http://localhost:3000
      REDIS_URL: redis://localhost:6379/0
      FRONTEND_URL: http://localhost:3000
      API_KEY_ENCRYPTION_KEY: ci-encryption-key-32-bytes-long
      SENDGRID_API_KEY: ""
      OPENAI_API_KEY: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Run backend tests
        run: pytest -q

  webui-tests:
    needs: changes
    if: needs.changes.outputs.webui == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webUI
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: webUI/package-lock.json

      - name: Install webUI dependencies
        run: npm ci

      - name: Run webUI tests
        env:
          CI: true
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chrome

      - name: Run webUI e2e
        env:
          CI: true
        run: npm run test:e2e

  deploy-backend-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.backend == 'true'
    needs:
      - changes
      - backend-tests
    uses: ./.github/workflows/deploy-backend.yml
    with:
      environment: dev
    secrets: inherit

  deploy-frontend-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.webui == 'true'
    needs:
      - changes
      - webui-tests
    uses: ./.github/workflows/deploy-frontend.yml
    with:
      environment: dev
    secrets: inherit
