name: Deploy Backend

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment
        type: string
        required: true
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        required: true
        options:
          - dev
          - staging
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-backend-${{ inputs.environment }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Resolve deploy metadata from SSM
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="/priddyspaces/${{ inputs.environment }}/deploy"

          echo "ecr_repo_uri=$(aws ssm get-parameter --name "$PREFIX/ecr_backend_repo_uri" --query 'Parameter.Value' --output text)" >> "$GITHUB_OUTPUT"
          echo "ecs_cluster=$(aws ssm get-parameter --name "$PREFIX/ecs_cluster_name" --query 'Parameter.Value' --output text)" >> "$GITHUB_OUTPUT"
          echo "ecs_service=$(aws ssm get-parameter --name "$PREFIX/ecs_backend_service_name" --query 'Parameter.Value' --output text)" >> "$GITHUB_OUTPUT"
          WORKER_SERVICE=$(aws ssm get-parameter --name "$PREFIX/ecs_backend_worker_service_name" --query 'Parameter.Value' --output text 2>/dev/null || true)
          echo "ecs_worker_service=$WORKER_SERVICE" >> "$GITHUB_OUTPUT"
          echo "ecs_private_subnets=$(aws ssm get-parameter --name "$PREFIX/ecs_private_subnets_csv" --query 'Parameter.Value' --output text)" >> "$GITHUB_OUTPUT"
          echo "ecs_security_groups=$(aws ssm get-parameter --name "$PREFIX/ecs_service_security_groups_csv" --query 'Parameter.Value' --output text)" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          REPO="${{ steps.meta.outputs.ecr_repo_uri }}"
          IMAGE_URI="$REPO:${GITHUB_SHA}"
          LATEST_URI="$REPO:latest"
          docker build -t "$IMAGE_URI" -t "$LATEST_URI" backend
          docker push "$IMAGE_URI"
          docker push "$LATEST_URI"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Register new task definition revision
        id: taskdef
        shell: bash
        run: |
          set -euo pipefail
          CLUSTER="${{ steps.meta.outputs.ecs_cluster }}"
          SERVICE="${{ steps.meta.outputs.ecs_service }}"
          IMAGE_URI="${{ steps.image.outputs.image_uri }}"

          CURRENT_TASK_DEF=$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          aws ecs describe-task-definition --task-definition "$CURRENT_TASK_DEF" --query 'taskDefinition' > taskdef.json

          # Patch image, and idempotently inject CLERK_* secrets into the
          # backend container's `secrets` array. The Secrets Manager ARN is
          # derived from any existing entry in `secrets` (all secrets live in
          # the same /priddyspaces/<env>/app/config blob), so no extra IAM
          # permissions are needed beyond what the task already has.
          jq --arg IMAGE_URI "$IMAGE_URI" --arg ENVIRONMENT "${{ inputs.environment }}" '
            def base_arn:
              (.[0].valueFrom // "") | split(":") | .[0:7] | join(":");
            def ensure(name; baseArn):
              if any(.[]; .name == name) then .
              else . + [{name: name, valueFrom: (baseArn + ":" + name + "::")}]
              end;
            def ensure_env(name; value):
              if any(.[]; .name == name) then
                map(if .name == name then .value = value else . end)
              else
                . + [{name: name, value: value}]
              end;
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .deregisteredAt,
              .registeredBy
            )
            | .containerDefinitions |= map(
                if .name == "backend" then
                  .image = $IMAGE_URI
                  | ((.secrets // []) | base_arn) as $arn
                  | .secrets = (
                      (.secrets // [])
                      | ensure("CLERK_JWKS_URL"; $arn)
                      | ensure("CLERK_SECRET_KEY"; $arn)
                      | ensure("CLERK_WEBHOOK_SECRET"; $arn)
                      | ensure("SENDGRID_API_KEY"; $arn)
                      | if $ENVIRONMENT == "dev" then .
                        else
                          ensure("JWT_SECRET"; $arn)
                          | ensure("PAYMENT_CREDENTIAL_ENCRYPTION_KEY"; $arn)
                          | ensure("STRIPE_SECRET_KEY"; $arn)
                          | ensure("STRIPE_WEBHOOK_SECRET"; $arn)
                        end
                    )
                  | .environment = (
                      (.environment // [])
                      | ensure_env("ENVIRONMENT"; $ENVIRONMENT)
                      | if $ENVIRONMENT == "dev" then ensure_env("ASSISTANT_ENABLED"; "true") else . end
                    )
                else . end
              )
          ' taskdef.json > taskdef-updated.json

          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://taskdef-updated.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "task_definition_arn=$NEW_TASK_DEF_ARN" >> "$GITHUB_OUTPUT"

      - name: Register new worker task definition revision
        id: worker_taskdef
        if: ${{ steps.meta.outputs.ecs_worker_service != '' }}
        shell: bash
        run: |
          set -euo pipefail
          CLUSTER="${{ steps.meta.outputs.ecs_cluster }}"
          SERVICE="${{ steps.meta.outputs.ecs_worker_service }}"
          IMAGE_URI="${{ steps.image.outputs.image_uri }}"

          CURRENT_TASK_DEF=$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          aws ecs describe-task-definition --task-definition "$CURRENT_TASK_DEF" --query 'taskDefinition' > worker-taskdef.json

          jq --arg IMAGE_URI "$IMAGE_URI" '
            def base_arn:
              (.[0].valueFrom // "") | split(":") | .[0:7] | join(":");
            def ensure(name; baseArn):
              if any(.[]; .name == name) then .
              else . + [{name: name, valueFrom: (baseArn + ":" + name + "::")}]
              end;
            def ensure_env(name; value):
              if any(.[]; .name == name) then
                map(if .name == name then .value = value else . end)
              else
                . + [{name: name, value: value}]
              end;
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .deregisteredAt,
              .registeredBy
            )
            | .containerDefinitions |= map(
                if .name == "backend" then
                  .image = $IMAGE_URI
                  | .command = ["python", "-m", "app.worker"]
                  | ((.secrets // []) | base_arn) as $arn
                  | .secrets = (
                      (.secrets // [])
                      | ensure("CLERK_JWKS_URL"; $arn)
                      | ensure("CLERK_SECRET_KEY"; $arn)
                      | ensure("CLERK_WEBHOOK_SECRET"; $arn)
                      | ensure("SENDGRID_API_KEY"; $arn)
                    )
                  | .environment = (
                      (.environment // [])
                      | ensure_env("WORKER_INTERVAL_SECONDS"; "60")
                      | ensure_env("WORKER_BATCH_LIMIT"; "100")
                      | ensure_env("WORKER_ENABLE_MARKETING"; "true")
                      | ensure_env("WORKER_ENABLE_ASSISTANT_JOBS"; "true")
                      | ensure_env("WORKER_ENABLE_CARDPOINTE_SETTLEMENTS"; "true")
                    )
                else . end
              )
          ' worker-taskdef.json > worker-taskdef-updated.json

          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://worker-taskdef-updated.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "task_definition_arn=$NEW_TASK_DEF_ARN" >> "$GITHUB_OUTPUT"

      - name: Run Alembic migration task
        shell: bash
        run: |
          set -euo pipefail
          CLUSTER="${{ steps.meta.outputs.ecs_cluster }}"
          TASK_DEF_ARN="${{ steps.taskdef.outputs.task_definition_arn }}"

          SUBNETS_JSON=$(jq -Rn --arg csv "${{ steps.meta.outputs.ecs_private_subnets }}" '$csv | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length>0))')
          SGS_JSON=$(jq -Rn --arg csv "${{ steps.meta.outputs.ecs_security_groups }}" '$csv | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length>0))')
          jq -n --argjson subnets "$SUBNETS_JSON" --argjson securityGroups "$SGS_JSON" \
            '{awsvpcConfiguration:{subnets:$subnets,securityGroups:$securityGroups,assignPublicIp:"DISABLED"}}' \
            > network-config.json

          aws ecs run-task \
            --cluster "$CLUSTER" \
            --launch-type FARGATE \
            --task-definition "$TASK_DEF_ARN" \
            --network-configuration file://network-config.json \
            --overrides '{"containerOverrides":[{"name":"backend","command":["python","-m","alembic","upgrade","head"]}]}' \
            --count 1 >/tmp/run-task.json

          TASK_ARN=$(jq -r '.tasks[0].taskArn' /tmp/run-task.json)
          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "null" ]; then
            echo "Failed to start migration task"
            cat /tmp/run-task.json
            exit 1
          fi

          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration task failed with exit code $EXIT_CODE"
            aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN"

            TASK_ID="${TASK_ARN##*/}"
            LOG_GROUP="/ecs/${{ steps.meta.outputs.ecs_service }}"
            LOG_STREAM=$(aws logs describe-log-streams \
              --log-group-name "$LOG_GROUP" \
              --log-stream-name-prefix "backend/backend/$TASK_ID" \
              --query 'logStreams[0].logStreamName' \
              --output text 2>/dev/null || true)

            if [ -n "$LOG_STREAM" ] && [ "$LOG_STREAM" != "None" ] && [ "$LOG_STREAM" != "null" ]; then
              echo "===== Migration task logs ($LOG_GROUP :: $LOG_STREAM) ====="
              aws logs get-log-events \
                --log-group-name "$LOG_GROUP" \
                --log-stream-name "$LOG_STREAM" \
                --limit 200 \
                --query 'events[].message' \
                --output text || true
              echo "===== End migration task logs ====="
            else
              echo "Could not find CloudWatch log stream for task id $TASK_ID in $LOG_GROUP"
            fi
            exit 1
          fi

      - name: Update ECS service
        shell: bash
        run: |
          set -euo pipefail
          CLUSTER="${{ steps.meta.outputs.ecs_cluster }}"
          SERVICE="${{ steps.meta.outputs.ecs_service }}"

          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --task-definition "${{ steps.taskdef.outputs.task_definition_arn }}"

          if ! aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"; then
            echo "===== Service failed to stabilize. Recent events: ====="
            aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
              --query 'services[0].events[0:25]' --output table || true

            echo "===== Stopped task (most recent) describe: ====="
            STOPPED_ARN=$(aws ecs list-tasks --cluster "$CLUSTER" --service-name "$SERVICE" \
              --desired-status STOPPED --query 'taskArns[0]' --output text 2>/dev/null || echo None)
            if [ -n "$STOPPED_ARN" ] && [ "$STOPPED_ARN" != "None" ]; then
              aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$STOPPED_ARN" \
                --query 'tasks[0].{lastStatus:lastStatus,stopCode:stopCode,stoppedReason:stoppedReason,containers:containers[].{name:name,exitCode:exitCode,reason:reason}}' || true
            fi
            exit 1
          fi

      - name: Update ECS worker service
        if: ${{ steps.meta.outputs.ecs_worker_service != '' }}
        shell: bash
        run: |
          set -euo pipefail
          CLUSTER="${{ steps.meta.outputs.ecs_cluster }}"
          SERVICE="${{ steps.meta.outputs.ecs_worker_service }}"

          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --task-definition "${{ steps.worker_taskdef.outputs.task_definition_arn }}"

          if ! aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"; then
            echo "===== Worker service failed to stabilize. Recent events: ====="
            aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
              --query 'services[0].events[0:25]' --output table || true

            echo "===== Worker stopped task (most recent) describe: ====="
            STOPPED_ARN=$(aws ecs list-tasks --cluster "$CLUSTER" --service-name "$SERVICE" \
              --desired-status STOPPED --query 'taskArns[0]' --output text 2>/dev/null || echo None)
            if [ -n "$STOPPED_ARN" ] && [ "$STOPPED_ARN" != "None" ]; then
              aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$STOPPED_ARN" \
                --query 'tasks[0].{lastStatus:lastStatus,stopCode:stopCode,stoppedReason:stoppedReason,containers:containers[].{name:name,exitCode:exitCode,reason:reason}}' || true
            fi
            exit 1
          fi
