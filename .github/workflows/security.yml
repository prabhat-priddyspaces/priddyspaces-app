name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "42 8 * * 1"

permissions:
  contents: read

jobs:
  backend-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install audit tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pip-audit bandit

      - name: Python dependency audit
        run: pip-audit -r requirements.txt

      - name: Python security scan
        run: bandit -q -r app -x tests --severity-level medium

  semgrep-sast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          python -m pip install semgrep

      - name: OWASP SAST scan
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/security-audit \
            --config p/secrets \
            --sarif \
            --output semgrep.sarif \
            --exclude .git \
            --exclude .next \
            --exclude .next-playwright-full \
            --exclude .next-playwright-security \
            --exclude node_modules \
            --exclude webUI/node_modules \
            --exclude mobile/node_modules

      - name: Upload Semgrep SARIF artifact
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 90

  webui-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webUI
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webUI/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate

  mobile-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        # Gate fails on any moderate+ advisory except documented, unfixable
        # transitive ones listed in mobile/audit-allowlist.json (see SECURITY-NOTES.md).
        run: node scripts/audit-gate.mjs

  sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: priddyspaces.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: priddyspaces-sbom
          path: priddyspaces.spdx.json
          retention-days: 90
