name: Seed Demo Data

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        required: true
        options:
          - dev
          - staging

permissions:
  id-token: write
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Resolve config from SSM
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="/priddyspaces/${{ inputs.environment }}/deploy"

          echo "ecr_repo_uri=$(aws ssm get-parameter --name "$PREFIX/ecr_backend_repo_uri" --query 'Parameter.Value' --output text)" >> "$GITHUB_OUTPUT"
          echo "ecs_cluster=$(aws ssm get-parameter --name "$PREFIX/ecs_cluster_name" --query 'Parameter.Value' --output text)" >> "$GITHUB_OUTPUT"
          echo "ecs_service=$(aws ssm get-parameter --name "$PREFIX/ecs_backend_service_name" --query 'Parameter.Value' --output text)" >> "$GITHUB_OUTPUT"
          echo "ecs_private_subnets=$(aws ssm get-parameter --name "$PREFIX/ecs_private_subnets_csv" --query 'Parameter.Value' --output text)" >> "$GITHUB_OUTPUT"
          echo "ecs_security_groups=$(aws ssm get-parameter --name "$PREFIX/ecs_service_security_groups_csv" --query 'Parameter.Value' --output text)" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build seed backend image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          REPO="${{ steps.meta.outputs.ecr_repo_uri }}"
          IMAGE_URI="$REPO:seed-${GITHUB_SHA}"
          docker build -t "$IMAGE_URI" backend
          docker push "$IMAGE_URI"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Run seed_demo_data task
        shell: bash
        run: |
          set -euo pipefail
          CLUSTER="${{ steps.meta.outputs.ecs_cluster }}"
          SERVICE="${{ steps.meta.outputs.ecs_service }}"
          ENVIRONMENT="${{ inputs.environment }}"
          IMAGE_URI="${{ steps.image.outputs.image_uri }}"
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          DEMO_OWNER_PASSWORD_PARAM_ARN="arn:aws:ssm:${AWS_REGION}:$ACCOUNT_ID:parameter/priddyspaces/$ENVIRONMENT/app/demo_owner_password"

          TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          aws ecs describe-task-definition --task-definition "$TASK_DEF_ARN" --query 'taskDefinition' > taskdef.json

          jq --arg image_uri "$IMAGE_URI" --arg demo_owner_password_param_arn "$DEMO_OWNER_PASSWORD_PARAM_ARN" '
            def ensure_secret(name; valueFrom):
              if any(.[]; .name == name) then
                map(if .name == name then .valueFrom = valueFrom else . end)
              else
                . + [{name: name, valueFrom: valueFrom}]
              end;

            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .deregisteredAt,
              .registeredBy
            )
            | .containerDefinitions |= map(
                if .name == "backend" then
                  .image = $image_uri
                  | .secrets = ((.secrets // []) | ensure_secret("DEMO_OWNER_PASSWORD"; $demo_owner_password_param_arn))
                else . end
              )
          ' taskdef.json > seed-taskdef.json

          SEED_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://seed-taskdef.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          SUBNETS_JSON=$(jq -Rn --arg csv "${{ steps.meta.outputs.ecs_private_subnets }}" '$csv | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length>0))')
          SGS_JSON=$(jq -Rn --arg csv "${{ steps.meta.outputs.ecs_security_groups }}" '$csv | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length>0))')
          jq -n --argjson subnets "$SUBNETS_JSON" --argjson securityGroups "$SGS_JSON" \
            '{awsvpcConfiguration:{subnets:$subnets,securityGroups:$securityGroups,assignPublicIp:"DISABLED"}}' \
            > network-config.json
          jq -n \
            '{containerOverrides:[{name:"backend",command:["python","-m","app.seed_demo_data"]}]}' \
            > seed-overrides.json

          aws ecs run-task \
            --cluster "$CLUSTER" \
            --launch-type FARGATE \
            --task-definition "$SEED_TASK_DEF_ARN" \
            --network-configuration file://network-config.json \
            --overrides file://seed-overrides.json \
            --count 1 >/tmp/run-task.json

          TASK_ARN=$(jq -r '.tasks[0].taskArn' /tmp/run-task.json)
          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "null" ]; then
            echo "Failed to start seed task"
            cat /tmp/run-task.json
            exit 1
          fi

          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"

          aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" > /tmp/describe-task.json
          jq -r '
            .tasks[0] as $task
            | ($task.containers // []) as $containers
            | (($containers[]? | select(.name == "backend")) // ($containers[0] // {})) as $container
            | "ECS stoppedReason: \($task.stoppedReason // "none")\nContainer reason: \($container.reason // "none")\nContainer exitCode: \($container.exitCode // "none")"
          ' /tmp/describe-task.json
          EXIT_CODE=$(jq -r '
            .tasks[0] as $task
            | ($task.containers // []) as $containers
            | (($containers[]? | select(.name == "backend")) // ($containers[0] // {}))
            | .exitCode // "null"
          ' /tmp/describe-task.json)

          TASK_ID="${TASK_ARN##*/}"
          LOG_GROUP="/ecs/$SERVICE"
          LOG_STREAM=$(aws logs describe-log-streams \
            --log-group-name "$LOG_GROUP" \
            --log-stream-name-prefix "backend/backend/$TASK_ID" \
            --query 'logStreams[0].logStreamName' \
            --output text 2>/dev/null || true)

          if [ -n "$LOG_STREAM" ] && [ "$LOG_STREAM" != "None" ] && [ "$LOG_STREAM" != "null" ]; then
            echo "===== Seed task logs ($LOG_GROUP :: $LOG_STREAM) ====="
            aws logs get-log-events \
              --log-group-name "$LOG_GROUP" \
              --log-stream-name "$LOG_STREAM" \
              --limit 200 \
              --query 'events[].message' \
              --output text || true
            echo "===== End seed task logs ====="
          fi

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Seed task failed with exit code $EXIT_CODE"
            exit 1
          fi
