name: Deploy Frontend

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment
        type: string
        required: true
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        required: true
        options:
          - dev
          - staging
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Resolve deploy metadata from SSM
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="/priddyspaces/${{ inputs.environment }}/deploy"

          echo "ecr_repo_uri=$(aws ssm get-parameter --name "$PREFIX/ecr_frontend_repo_uri" --query 'Parameter.Value' --output text)" >> "$GITHUB_OUTPUT"
          echo "ecs_cluster=$(aws ssm get-parameter --name "$PREFIX/ecs_cluster_name" --query 'Parameter.Value' --output text)" >> "$GITHUB_OUTPUT"
          echo "ecs_service=$(aws ssm get-parameter --name "$PREFIX/ecs_frontend_service_name" --query 'Parameter.Value' --output text)" >> "$GITHUB_OUTPUT"
          echo "frontend_asset_bucket=$(aws ssm get-parameter --name "$PREFIX/frontend_asset_bucket" --query 'Parameter.Value' --output text)" >> "$GITHUB_OUTPUT"
          echo "frontend_asset_prefix=$(aws ssm get-parameter --name "$PREFIX/frontend_asset_prefix" --query 'Parameter.Value' --output text)" >> "$GITHUB_OUTPUT"
          echo "api_origin=$(aws ssm get-parameter --name "$PREFIX/api_origin" --query 'Parameter.Value' --output text)" >> "$GITHUB_OUTPUT"

          FRONTEND_ORIGIN=$(aws ssm get-parameter --name "$PREFIX/frontend_origin" --query 'Parameter.Value' --output text 2>/dev/null || true)
          if [ -z "$FRONTEND_ORIGIN" ]; then
            FRONTEND_ORIGIN=$(aws ssm get-parameter --name "$PREFIX/frontend_url" --query 'Parameter.Value' --output text 2>/dev/null || true)
          fi
          if [ -z "$FRONTEND_ORIGIN" ]; then
            case "${{ inputs.environment }}" in
              dev) FRONTEND_ORIGIN="https://app.dev.priddyspaces.com" ;;
              staging) FRONTEND_ORIGIN="https://app.staging.priddyspaces.com" ;;
              prod|production) FRONTEND_ORIGIN="https://app.priddyspaces.com" ;;
              *) FRONTEND_ORIGIN="" ;;
            esac
          fi
          if [ -z "$FRONTEND_ORIGIN" ]; then
            echo "::error::Unable to resolve frontend origin for ${{ inputs.environment }}"
            exit 1
          fi
          FRONTEND_ORIGIN="${FRONTEND_ORIGIN%/}"
          echo "frontend_origin=$FRONTEND_ORIGIN" >> "$GITHUB_OUTPUT"
          echo "clerk_sign_in_url=$FRONTEND_ORIGIN/sign-in" >> "$GITHUB_OUTPUT"
          echo "clerk_sign_up_url=$FRONTEND_ORIGIN/sign-up" >> "$GITHUB_OUTPUT"
          echo "clerk_post_auth_url=$FRONTEND_ORIGIN/dashboard" >> "$GITHUB_OUTPUT"

          GMAPS_KEY=$(aws ssm get-parameter --name "$PREFIX/google_maps_api_key" --with-decryption --query 'Parameter.Value' --output text 2>/dev/null || echo "")
          echo "::add-mask::$GMAPS_KEY"
          echo "google_maps_api_key=$GMAPS_KEY" >> "$GITHUB_OUTPUT"

          CLERK_PK=$(aws ssm get-parameter --name "$PREFIX/clerk_publishable_key" --query 'Parameter.Value' --output text)
          echo "clerk_publishable_key=$CLERK_PK" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build builder stage and extract static assets
        id: builder
        shell: bash
        env:
          API_ORIGIN: ${{ steps.meta.outputs.api_origin }}
          CLERK_PUBLISHABLE_KEY: ${{ steps.meta.outputs.clerk_publishable_key }}
          APP_ORIGIN: ${{ steps.meta.outputs.frontend_origin }}
          CLERK_SIGN_IN_URL: ${{ steps.meta.outputs.clerk_sign_in_url }}
          CLERK_SIGN_UP_URL: ${{ steps.meta.outputs.clerk_sign_up_url }}
          CLERK_POST_AUTH_URL: ${{ steps.meta.outputs.clerk_post_auth_url }}
          GOOGLE_MAPS_API_KEY: ${{ steps.meta.outputs.google_maps_api_key }}
          ASSET_PREFIX: ${{ steps.meta.outputs.frontend_asset_prefix }}
        run: |
          set -euo pipefail
          REPO="${{ steps.meta.outputs.ecr_repo_uri }}"
          BUILDER_IMAGE="$REPO:builder-${GITHUB_SHA}"
          CONTAINER_NAME="frontend-static-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          docker build --target builder \
            --build-arg NEXT_PUBLIC_API_BASE_URL="$API_ORIGIN" \
            --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="$CLERK_PUBLISHABLE_KEY" \
            --build-arg NEXT_PUBLIC_APP_ORIGIN="$APP_ORIGIN" \
            --build-arg NEXT_PUBLIC_CLERK_SIGN_IN_URL="$CLERK_SIGN_IN_URL" \
            --build-arg NEXT_PUBLIC_CLERK_SIGN_UP_URL="$CLERK_SIGN_UP_URL" \
            --build-arg NEXT_PUBLIC_CLERK_SIGN_IN_FORCE_REDIRECT_URL="$CLERK_POST_AUTH_URL" \
            --build-arg NEXT_PUBLIC_CLERK_SIGN_UP_FORCE_REDIRECT_URL="$CLERK_POST_AUTH_URL" \
            --build-arg NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL="$CLERK_POST_AUTH_URL" \
            --build-arg NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL="$CLERK_POST_AUTH_URL" \
            --build-arg NEXT_PUBLIC_GOOGLE_MAPS_API_KEY="$GOOGLE_MAPS_API_KEY" \
            --build-arg NEXT_ASSET_PREFIX="$ASSET_PREFIX" \
            --build-arg NEXT_PUBLIC_APP_ENV="${{ inputs.environment }}" \
            -t "$BUILDER_IMAGE" webUI

          rm -rf next-static
          docker create --name "$CONTAINER_NAME" "$BUILDER_IMAGE" >/dev/null
          trap 'docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true' EXIT
          docker cp "$CONTAINER_NAME:/app/.next/static" ./next-static

      - name: Upload static assets to S3
        shell: bash
        run: |
          set -euo pipefail
          aws s3 sync ./next-static "s3://${{ steps.meta.outputs.frontend_asset_bucket }}/_next/static" \
            --cache-control "public,max-age=31536000,immutable" \
            --size-only

      - name: Build and push frontend image
        id: image
        shell: bash
        env:
          API_ORIGIN: ${{ steps.meta.outputs.api_origin }}
          CLERK_PUBLISHABLE_KEY: ${{ steps.meta.outputs.clerk_publishable_key }}
          APP_ORIGIN: ${{ steps.meta.outputs.frontend_origin }}
          CLERK_SIGN_IN_URL: ${{ steps.meta.outputs.clerk_sign_in_url }}
          CLERK_SIGN_UP_URL: ${{ steps.meta.outputs.clerk_sign_up_url }}
          CLERK_POST_AUTH_URL: ${{ steps.meta.outputs.clerk_post_auth_url }}
          GOOGLE_MAPS_API_KEY: ${{ steps.meta.outputs.google_maps_api_key }}
          ASSET_PREFIX: ${{ steps.meta.outputs.frontend_asset_prefix }}
        run: |
          set -euo pipefail
          REPO="${{ steps.meta.outputs.ecr_repo_uri }}"
          IMAGE_URI="$REPO:${GITHUB_SHA}"
          LATEST_URI="$REPO:latest"

          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL="$API_ORIGIN" \
            --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="$CLERK_PUBLISHABLE_KEY" \
            --build-arg NEXT_PUBLIC_APP_ORIGIN="$APP_ORIGIN" \
            --build-arg NEXT_PUBLIC_CLERK_SIGN_IN_URL="$CLERK_SIGN_IN_URL" \
            --build-arg NEXT_PUBLIC_CLERK_SIGN_UP_URL="$CLERK_SIGN_UP_URL" \
            --build-arg NEXT_PUBLIC_CLERK_SIGN_IN_FORCE_REDIRECT_URL="$CLERK_POST_AUTH_URL" \
            --build-arg NEXT_PUBLIC_CLERK_SIGN_UP_FORCE_REDIRECT_URL="$CLERK_POST_AUTH_URL" \
            --build-arg NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL="$CLERK_POST_AUTH_URL" \
            --build-arg NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL="$CLERK_POST_AUTH_URL" \
            --build-arg NEXT_PUBLIC_GOOGLE_MAPS_API_KEY="$GOOGLE_MAPS_API_KEY" \
            --build-arg NEXT_ASSET_PREFIX="$ASSET_PREFIX" \
            --build-arg NEXT_PUBLIC_APP_ENV="${{ inputs.environment }}" \
            -t "$IMAGE_URI" \
            -t "$LATEST_URI" \
            webUI

          docker push "$IMAGE_URI"
          docker push "$LATEST_URI"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Register new task definition revision
        id: taskdef
        shell: bash
        env:
          API_ORIGIN: ${{ steps.meta.outputs.api_origin }}
          CLERK_PUBLISHABLE_KEY: ${{ steps.meta.outputs.clerk_publishable_key }}
          APP_ORIGIN: ${{ steps.meta.outputs.frontend_origin }}
          CLERK_SIGN_IN_URL: ${{ steps.meta.outputs.clerk_sign_in_url }}
          CLERK_SIGN_UP_URL: ${{ steps.meta.outputs.clerk_sign_up_url }}
          CLERK_POST_AUTH_URL: ${{ steps.meta.outputs.clerk_post_auth_url }}
          GOOGLE_MAPS_API_KEY: ${{ steps.meta.outputs.google_maps_api_key }}
          ASSET_PREFIX: ${{ steps.meta.outputs.frontend_asset_prefix }}
        run: |
          set -euo pipefail
          CLUSTER="${{ steps.meta.outputs.ecs_cluster }}"
          SERVICE="${{ steps.meta.outputs.ecs_service }}"
          IMAGE_URI="${{ steps.image.outputs.image_uri }}"

          CURRENT_TASK_DEF=$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          aws ecs describe-task-definition --task-definition "$CURRENT_TASK_DEF" --query 'taskDefinition' > taskdef.json

          jq \
            --arg IMAGE_URI "$IMAGE_URI" \
            --arg API_ORIGIN "$API_ORIGIN" \
            --arg GMAPS_KEY "$GOOGLE_MAPS_API_KEY" \
            --arg CLERK_PK "$CLERK_PUBLISHABLE_KEY" \
            --arg APP_ORIGIN "$APP_ORIGIN" \
            --arg CLERK_SIGN_IN_URL "$CLERK_SIGN_IN_URL" \
            --arg CLERK_SIGN_UP_URL "$CLERK_SIGN_UP_URL" \
            --arg CLERK_POST_AUTH_URL "$CLERK_POST_AUTH_URL" \
            --arg ASSET_PREFIX "$ASSET_PREFIX" '
            def base_arn:
              (.[0].valueFrom // "") | split(":") | .[0:7] | join(":");
            def ensure_secret(name; baseArn):
              if any(.[]; .name == name) then .
              else . + [{name: name, valueFrom: (baseArn + ":" + name + "::")}]
              end;
            def ensure_env(name; value):
              if any(.[]; .name == name) then
                map(if .name == name then .value = value else . end)
              else
                . + [{name: name, value: value}]
              end;
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .deregisteredAt,
              .registeredBy
            )
            | .containerDefinitions |= map(
                if .name == "frontend" then
                  .image = $IMAGE_URI
                  | ((.secrets // []) | base_arn) as $arn
                  | if $arn == "" then
                      error("frontend task definition has no base secret ARN")
                    else
                      .secrets = ((.secrets // []) | ensure_secret("CLERK_SECRET_KEY"; $arn))
                    end
                  | .environment = (
                      (.environment // [])
                      | ensure_env("NODE_ENV"; "production")
                      | ensure_env("PORT"; "3000")
                      | ensure_env("NEXT_PUBLIC_API_BASE_URL"; $API_ORIGIN)
                      | ensure_env("NEXT_PUBLIC_GOOGLE_MAPS_API_KEY"; $GMAPS_KEY)
                      | ensure_env("NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"; $CLERK_PK)
                      | ensure_env("NEXT_PUBLIC_APP_ORIGIN"; $APP_ORIGIN)
                      | ensure_env("CLERK_SIGN_IN_URL"; $CLERK_SIGN_IN_URL)
                      | ensure_env("NEXT_PUBLIC_CLERK_SIGN_IN_URL"; $CLERK_SIGN_IN_URL)
                      | ensure_env("CLERK_SIGN_UP_URL"; $CLERK_SIGN_UP_URL)
                      | ensure_env("NEXT_PUBLIC_CLERK_SIGN_UP_URL"; $CLERK_SIGN_UP_URL)
                      | ensure_env("CLERK_SIGN_IN_FORCE_REDIRECT_URL"; $CLERK_POST_AUTH_URL)
                      | ensure_env("NEXT_PUBLIC_CLERK_SIGN_IN_FORCE_REDIRECT_URL"; $CLERK_POST_AUTH_URL)
                      | ensure_env("CLERK_SIGN_UP_FORCE_REDIRECT_URL"; $CLERK_POST_AUTH_URL)
                      | ensure_env("NEXT_PUBLIC_CLERK_SIGN_UP_FORCE_REDIRECT_URL"; $CLERK_POST_AUTH_URL)
                      | ensure_env("CLERK_SIGN_IN_FALLBACK_REDIRECT_URL"; $CLERK_POST_AUTH_URL)
                      | ensure_env("NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL"; $CLERK_POST_AUTH_URL)
                      | ensure_env("CLERK_SIGN_UP_FALLBACK_REDIRECT_URL"; $CLERK_POST_AUTH_URL)
                      | ensure_env("NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL"; $CLERK_POST_AUTH_URL)
                      | ensure_env("NEXT_ASSET_PREFIX"; $ASSET_PREFIX)
                      | ensure_env("NEXT_PUBLIC_APP_ENV"; "${{ inputs.environment }}")
                    )
                else . end
              )
          ' taskdef.json > taskdef-updated.json

          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://taskdef-updated.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "task_definition_arn=$NEW_TASK_DEF_ARN" >> "$GITHUB_OUTPUT"

      - name: Update ECS service
        shell: bash
        run: |
          set -euo pipefail
          CLUSTER="${{ steps.meta.outputs.ecs_cluster }}"
          SERVICE="${{ steps.meta.outputs.ecs_service }}"

          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --task-definition "${{ steps.taskdef.outputs.task_definition_arn }}"

          if ! aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"; then
            echo "===== Service failed to stabilize. Recent events: ====="
            aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
              --query 'services[0].events[0:25]' --output table || true

            echo "===== Stopped task (most recent) describe: ====="
            STOPPED_ARN=$(aws ecs list-tasks --cluster "$CLUSTER" --service-name "$SERVICE" \
              --desired-status STOPPED --query 'taskArns[0]' --output text 2>/dev/null || echo None)
            if [ -n "$STOPPED_ARN" ] && [ "$STOPPED_ARN" != "None" ]; then
              aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$STOPPED_ARN" \
                --query 'tasks[0].{lastStatus:lastStatus,stopCode:stopCode,stoppedReason:stoppedReason,containers:containers[].{name:name,exitCode:exitCode,reason:reason}}' || true
            fi
            exit 1
          fi

      - name: Smoke test frontend edge
        shell: bash
        run: |
          set -euo pipefail
          FRONTEND_ORIGIN="${{ steps.meta.outputs.frontend_origin }}"
          if [ -z "$FRONTEND_ORIGIN" ]; then
            echo "::warning::No frontend origin configured; skipping public edge smoke test."
            exit 0
          fi

          HEALTH_URL="${FRONTEND_ORIGIN%/}/api/health?deploy_sha=${GITHUB_SHA}&attempt=${GITHUB_RUN_ATTEMPT}"
          ROOT_URL="${FRONTEND_ORIGIN%/}/?deploy_sha=${GITHUB_SHA}&attempt=${GITHUB_RUN_ATTEMPT}"
          HEALTH_HEADERS="$(mktemp)"
          HEALTH_BODY="$(mktemp)"
          ROOT_BODY="$(mktemp)"

          for attempt in {1..12}; do
            STATUS=$(curl -sS -D "$HEALTH_HEADERS" -o "$HEALTH_BODY" -w "%{http_code}" \
              --max-time 20 \
              --retry 0 \
              -H "Cache-Control: no-cache" \
              "$HEALTH_URL" || true)
            CACHE_CONTROL=$(awk 'BEGIN { IGNORECASE = 1 } /^cache-control:/ { sub(/\r$/, ""); print $0 }' "$HEALTH_HEADERS" | tail -n 1)

            if [ "$STATUS" = "200" ] \
              && jq -e '.status == "ok"' "$HEALTH_BODY" >/dev/null 2>&1 \
              && [[ "$CACHE_CONTROL" == *"no-store"* ]]; then
              ROOT_STATUS=$(curl -sS -o "$ROOT_BODY" -w "%{http_code}" \
                --max-time 20 \
                --retry 0 \
                -H "Cache-Control: no-cache" \
                "$ROOT_URL" || true)

              if [[ "$ROOT_STATUS" =~ ^(200|30[1278])$ ]]; then
                echo "Frontend edge smoke check passed for $HEALTH_URL and $ROOT_URL"
                exit 0
              fi

              echo "Frontend root smoke check failed with HTTP $ROOT_STATUS."
              sed -n '1,20p' "$ROOT_BODY" || true
            fi

            echo "Frontend edge smoke check attempt $attempt failed with HTTP $STATUS."
            echo "Cache-Control: ${CACHE_CONTROL:-missing}"
            sed -n '1,30p' "$HEALTH_HEADERS" || true
            sed -n '1,20p' "$HEALTH_BODY" || true
            sleep 10
          done

          echo "Frontend edge smoke check failed for $HEALTH_URL"
          exit 1
